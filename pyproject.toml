[project]
name = "coversense"
version = "0.1.0"
description = "Infer music genre from album cover art."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19.0",
  "fastapi>=0.115.0",
  "joblib>=1.4.0",
  "numpy>=1.26.0",
  "pillow>=10.3.0",
  "python-multipart>=0.0.9",
  "scikit-learn>=1.4.0",
  "torch>=2.2.0",
  "tqdm>=4.66.0",
  "transformers>=4.41.0",
  "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false
