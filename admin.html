<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CoverSense Admin</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell admin-shell">
      <section class="workspace" aria-label="CoverSense model observability">
        <header class="topbar">
          <a class="brand-mark" href="/" aria-label="CoverSense home">
            <span class="brand-glyph" aria-hidden="true"></span>
            CoverSense
          </a>
          <nav class="top-nav" aria-label="Primary navigation">
            <a href="/">Predict</a>
            <details class="menu-dropdown">
              <summary>Menu</summary>
              <div class="menu-list">
                <a href="/">Inference app</a>
                <a href="/admin">Model dashboard</a>
                <a href="https://github.com/okihayashi/coversense">GitHub repo</a>
              </div>
            </details>
          </nav>
          <div class="topbar-actions">
            <div class="model-pill">
              <span class="status-dot"></span>
              Evaluation reports
            </div>
            <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark and light mode">Dark</button>
            <a class="admin-link" href="/">Predict</a>
          </div>
        </header>

        <section class="admin-heading">
          <p class="eyebrow">CoverSense Admin</p>
          <h1>Model observability</h1>
        </section>

        <section id="modelGrid" class="admin-model-grid" aria-label="Model list"></section>

        <section class="admin-detail-grid">
          <div class="admin-panel">
            <div class="admin-panel-header">
              <div>
                <p class="section-label">Selected Model</p>
                <h2 id="selectedModelName">Loading</h2>
              </div>
              <button id="showAllToggle" class="toggle-button" type="button" aria-pressed="false">Failures</button>
            </div>
            <dl id="metricList" class="metric-list"></dl>
          </div>

          <div class="admin-panel failure-panel">
            <div class="admin-panel-header">
              <div>
                <p class="section-label">Error Analysis</p>
                <h2 id="failureTitle">Failed artwork</h2>
              </div>
              <div class="pagination-actions">
                <button id="prevPage" class="icon-page-button" type="button" aria-label="Previous page">&lt;</button>
                <span id="pageStatus" class="count-pill">0</span>
                <button id="nextPage" class="icon-page-button" type="button" aria-label="Next page">&gt;</button>
              </div>
            </div>
            <div id="failureGrid" class="failure-grid" aria-live="polite"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="admin.js?v=20260529-admin-pagination"></script>
  </body>
</html>
